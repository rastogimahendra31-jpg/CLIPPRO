button,a.btn{border:1px solid var(--l);background:var(--p);color:var(--t);border-radius:11px;font-weight:600;box-shadow:0 1px 2px rgba(60,40,20,.05);transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .18s,border-color .18s,color .18s}

button.p{background:linear-gradient(180deg,var(--a2),var(--a));color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 18px rgba(200,87,27,.3)}
button.p:hover{background:linear-gradient(180deg,#EA8A4C,var(--ah));box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 12px 26px rgba(200,87,27,.36)}

button.p.big{min-height:54px;padding:12px 26px;font-size:16px;border-radius:14px}
button.btn2,a.btn2{background:var(--tint);color:var(--ah);border:0;box-shadow:none}button.btn2:hover{background:var(--tint2);box-shadow:none}
button.btn3{background:none;border:0;box-shadow:none;color:var(--at);padding:8px 10px;min-height:36px}button.btn3:hover{background:var(--tint);transform:none;box-shadow:none}
button.ic{width:40px;min-width:40px;padding:0;justify-content:center;font-size:18px}
button.d{background:var(--f);color:#fff;border-color:transparent;box-shadow:none;outline:0}
button[aria-pressed=true]{background:var(--t);color:var(--bg);border-color:var(--t)}
button:disabled,button:disabled:hover{opacity:.45;transform:none;box-shadow:none}
input,select,textarea{background:var(--p);color:var(--t);border:1px solid var(--l);border-radius:11px;transition:border-color .18s,box-shadow .18s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--a);box-shadow:0 0 0 3px rgba(200,87,27,.16)}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--a)}
/* toggle switch for every on/off checkbox inside .tog */
label.tog input[type=checkbox]{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:999px;background:var(--l2);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
label.tog input[type=checkbox]::after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s var(--spring)}
label.tog input[type=checkbox]:checked{background:var(--a)}label.tog input[type=checkbox]:checked::after{transform:translateX(17px)}
label.tog input[type=checkbox]:disabled{opacity:.5}
.chip{border:0;color:#fff;font-weight:600;letter-spacing:.02em}.chip.PASS{color:#fff}.chip.na{background:var(--c);color:var(--t)}.chip.len{background:rgba(255,252,247,.92);color:#211C16;border:1px solid var(--l)}.chip.ver{color:#fff}.chip.mt{border:0}
.card{border:1px solid var(--l);border-radius:16px;box-shadow:var(--sh);background:var(--p);transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.card.sel,.card:focus-visible{border-color:var(--a);box-shadow:var(--sha)}
.card.sk{background:linear-gradient(90deg,var(--c),var(--p),var(--c));background-size:200% 100%;animation:hlshim 1.4s linear infinite;box-shadow:none}

.panel,.form,.side{border:1px solid var(--l);border-radius:var(--r2);box-shadow:var(--sh);padding:22px;background:var(--p)}
.panel.hi{border-color:rgba(200,87,27,.38);box-shadow:var(--sha);background:linear-gradient(180deg,var(--tint),var(--p) 62%)}
pre{background:var(--c);border:1px solid var(--l);color:var(--t)}
.note{border:1px solid var(--l);border-left:4px solid var(--a);background:var(--p)}.note.bad{border-left-color:var(--f)}
.tabs{border-bottom:1px solid var(--l)}.tabs button,.seg button,#nav button,.fold{box-shadow:none}.tabs button:hover,.seg button:hover,.fold:hover{transform:none;box-shadow:none}
.tabs button[aria-pressed=true]{border-bottom-color:var(--a);color:var(--t);background:none}
.seg{border:1px solid var(--l);background:var(--c);border-radius:12px}.seg button[aria-pressed=true]{background:var(--p);color:var(--t);box-shadow:0 1px 3px rgba(60,40,20,.16)}
#toast{background:var(--t);color:var(--bg);border:0;border-radius:12px;box-shadow:0 14px 36px rgba(30,20,10,.28);animation:hlup .3s var(--spring)}#toast.err{background:var(--f);color:#fff}
@keyframes hlup{from{opacity:0;transform:translate(-50%,12px)}}
dialog{background:var(--p);color:var(--t);border:1px solid var(--l);border-radius:20px;box-shadow:0 28px 70px rgba(20,12,5,.3)}dialog::backdrop{background:rgba(20,15,10,.45);backdrop-filter:blur(4px)}
dialog[open]{animation:hlpop .25s var(--spring)}@keyframes hlpop{from{opacity:0;transform:translateY(12px) scale(.97)}}
.stat{border:1px solid var(--l);background:var(--p)}.tray{border:1px dashed var(--l2);background:var(--p)}
.spin{border-color:var(--a);border-right-color:transparent}

#nav #thm svg{width:20px;height:20px}
#col{padding:30px 40px 56px}header #h1{font-size:28px}
/* motion */
#main>*{animation:hlin .4s var(--ease) both}#main>*:nth-child(2){animation-delay:.05s}#main>*:nth-child(3){animation-delay:.1s}#main>*:nth-child(4){animation-delay:.15s}#main>*:nth-child(5){animation-delay:.2s}
@keyframes hlin{from{opacity:0;transform:translateY(10px)}}
.grid>.card{animation:hlin .45s var(--ease) both}.grid>.card:nth-child(2){animation-delay:.04s}.grid>.card:nth-child(3){animation-delay:.08s}.grid>.card:nth-child(4){animation-delay:.12s}.grid>.card:nth-child(5){animation-delay:.16s}.grid>.card:nth-child(n+6){animation-delay:.2s}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:26px;align-items:center;padding:30px;border-radius:24px;border:1px solid var(--l);background:radial-gradient(120% 140% at 100% 0%,var(--tint2) 0%,transparent 55%),var(--p);box-shadow:var(--sh)}

.tile b{font:700 26px var(--fd);color:var(--t);line-height:1.1}.tile span{font-size:13px;color:var(--m);font-weight:500}.tile small{grid-column:1/3;margin-top:6px;white-space:normal}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}

.upr{display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px;transition:background .18s}.upr:hover{background:var(--c)}

@keyframes hlpulse{0%,100%{box-shadow:0 0 0 0 rgba(200,87,27,.4)}50%{box-shadow:0 0 0 7px rgba(200,87,27,0)}}
/* schedule */
.uptrack{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(140px,160px);gap:12px;overflow-x:auto;padding-bottom:6px}
.upc{display:grid;gap:6px}.upc img,.upc .ph{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:14px;background:var(--c);box-shadow:var(--sh)}
.upc .when{font:700 12px var(--fd);color:var(--a)}.upc b{font-size:12.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.emptyc{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:18px;border-radius:16px;background:var(--c)}.emptyc p{margin:0;flex:1 1 260px;color:var(--m)}

 .src-opts{grid-template-columns:1fr 1fr}.pmc{grid-template-columns:1fr}.row2{grid-template-columns:1fr}.create>.panel{padding-left:22px}.stepnum{position:static;margin-bottom:6px}.lp{grid-template-columns:1fr;position:static}.lp-stage{width:min(240px,100%);margin:auto}.hero{padding:20px}.hero h2{font-size:24px}}

async function renderYtSettings(container, api) {

    const inp = (ph, type) => { const i = ytEl('input', 'min-height:44px;padding:8px 12px;background:var(--bg);color:var(--t);border:2px solid var(--l);border-radius:var(--r);width:100%;box-sizing:border-box;margin:4px 0'); i.placeholder = ph; i.type = type || 'text'; i.setAttribute('aria-label', ph); i.autocomplete = 'off'; return i; };

    container.append(ytEl('h3', 'margin:0 0 6px', 'YouTube stats'),

      ytEl('div', 'margin:6px 0', st.has_key ? 'API key saved.' : 'No API key yet.'), key, ch,
      ytBtn('Save', async () => { const r = await api('/api/yt/key', { api_key: key.value, channel: ch.value }); r.error ? (msg.style.color = 'var(--f)', msg.textContent = r.error) : draw(); }),
      ytEl('div', 'margin:14px 0 4px', st.signed_in ? 'Signed in to Analytics.' : 'Optional: OAuth client JSON (Google Cloud, Desktop app).'), file,
      ytBtn('Add and sign in', async () => { if (!file.files[0]) return; const r = await api('/api/yt/oauth', { client_json: await file.files[0].text() }); if (r.error) { msg.style.color = 'var(--f)'; msg.textContent = r.error; } else { window.open(r.auth_url, '_blank', 'noopener'); msg.textContent = 'Finish the sign-in in the new tab, then reopen this card.'; } }, 'margin-left:8px'), msg);
  };
  draw();
}

'v.intro':["Say <b>one sentence</b> about this moment, a few seconds long. Your take is what makes the clip yours. The game sound drops while you talk and comes back after. You get a new version; the original stays.", "Dites <b>une phrase</b> sur ce moment, quelques secondes. Votre commentaire rend le clip unique. Le son du jeu baisse pendant que vous parlez et revient après. Vous obtenez une nouvelle version ; l'original reste.", "Di <b>una frase</b> sobre este momento, de unos segundos. Tu comentario es lo que hace tuyo el clip. El sonido del juego baja mientras hablas y vuelve después. Obtienes una versión nueva; el original se queda.", "Diga <b>uma frase</b> sobre este momento, de alguns segundos. Seu comentário é o que torna o clipe seu. O som do jogo abaixa enquanto você fala e volta depois. Você recebe uma nova versão; o original fica.", "Sag <b>einen Satz</b> zu diesem Moment, ein paar Sekunden lang. Dein Kommentar macht den Clip zu deinem. Der Spielsound wird leiser, während du sprichst, und kommt danach zurück. Du bekommst eine neue Version; das Original bleibt.", "قل <b>جملة واحدة</b> عن هذه اللحظة، لبضع ثوانٍ. تعليقك هو ما يجعل المقطع لك. يخفت صوت اللعبة أثناء حديثك ويعود بعده. تحصل على نسخة جديدة؛ والأصل يبقى.", "Di' <b>una frase</b> su questo momento, di pochi secondi. Il tuo commento rende la clip tua. L'audio del gioco si abbassa mentre parli e torna dopo. Ottieni una nuova versione; l'originale resta.", "Bu an hakkında <b>bir cümle</b> söyle, birkaç saniyelik. Yorumun klibi senin yapan şey. Oyun sesi sen konuşurken kısılır ve sonra geri gelir. Yeni bir sürüm alırsın; orijinal kalır.","इस मोमेंट पर <b>एक लाइन</b> बोलें, कुछ सेकंड की। आपकी राय ही clip को आपका बनाती है। आपके बोलते समय गेम की आवाज़ धीमी होगी और फिर वापस आएगी। नया वर्ज़न बनेगा, ओरिजिनल वैसा ही रहेगा।"],
